[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ebteqdesk-grok-mcp"
version = "0.1.0"
description = "Dedicated Ebteqdesk MCP server for Grok Bot support automation and To-Do Kanban workflows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ebteqdesk Team" },
]
keywords = ["mcp", "fastmcp", "ebteqdesk", "grok", "ticketing", "todo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
]

[project.scripts]
ebteqdesk-grok-mcp = "ebteqdesk_grok_mcp.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
